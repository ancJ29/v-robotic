# Builds web/ and deploys it, with its lead Function, to Cloudflare Pages (direct upload).
# Deliberate: it runs only when someone presses "Run workflow" on main, never on a push.
# The site is noindex; this workflow checks that on the built output and fails if it is not.
# Two ways to run it. By hand: content_source stays "seed" (the default; needs no Strapi box).
# From Strapi's Publish button: the relay Function /api/rebuild starts it with content_source=strapi,
# and only that run reads the box. The repository's own default is never "strapi".
# NEVER RUN: written in a sandbox without GitHub (docs/conventions/publish.md).
name: web-deploy

on:
  workflow_dispatch:
    inputs:
      content_source:
        description: 'Where the pages get their content: seed (the committed files) or strapi (the CMS box)'
        type: choice
        options: [seed, strapi]
        default: seed

permissions:
  contents: read

concurrency:
  group: web-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy web (Cloudflare Pages, production)
    # Only the trunk goes live: running it from another branch skips the job instead of deploying.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      ASTRO_TELEMETRY_DISABLED: '1'
      # Read at BUILD time (printed into the page). A GitHub repository VARIABLE, not a secret: it is public.
      PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
      TURNSTILE_TEST_SITE_KEY: 1x00000000000000000000AA
      # The content switch is flipped HERE, per run, never in the repository's default.
      CONTENT_SOURCE: ${{ inputs.content_source || 'seed' }}
      # Read only by a strapi run. STRAPI_URL is the box's PUBLIC https address; images are addressed from it too
      # (open item 17), so it must be an address a visitor can open.
      STRAPI_URL: ${{ inputs.content_source == 'strapi' && vars.STRAPI_URL || '' }}
      STRAPI_PUBLIC_URL: ${{ inputs.content_source == 'strapi' && vars.STRAPI_URL || '' }}
      STRAPI_TOKEN: ${{ inputs.content_source == 'strapi' && secrets.STRAPI_TOKEN || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Require the real Turnstile site key
        run: |
          if [ -z "$PUBLIC_TURNSTILE_SITE_KEY" ]; then
            echo "::error::The repository variable PUBLIC_TURNSTILE_SITE_KEY is not set. Without it the page ships Cloudflare's always-passes test key, which fails against the real secret."
            exit 1
          fi
          if [ "$PUBLIC_TURNSTILE_SITE_KEY" = "$TURNSTILE_TEST_SITE_KEY" ]; then
            echo "::error::PUBLIC_TURNSTILE_SITE_KEY is Cloudflare's test key. Set the real site key."
            exit 1
          fi
          echo "site key present (${#PUBLIC_TURNSTILE_SITE_KEY} characters)"

      - name: Require a reachable box when building from Strapi
        if: env.CONTENT_SOURCE == 'strapi'
        run: |
          if [ -z "$STRAPI_URL" ] || [ -z "$STRAPI_TOKEN" ]; then
            echo "::error::A strapi run needs the repository variable STRAPI_URL and the secret STRAPI_TOKEN."
            exit 1
          fi
          case "$STRAPI_URL" in
            https://127.*|https://localhost*|http://*) echo "::error::STRAPI_URL must be the box's public https address, got $STRAPI_URL"; exit 1;;
            https://*) ;;
            *) echo "::error::STRAPI_URL must start with https://"; exit 1;;
          esac
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${STRAPI_URL%/}/_health" || true)"
          echo "box health: $code"
          if [ "$code" != 204 ]; then
            echo "::error::The CMS box did not answer healthy ($code). Nothing was built or deployed; the live site is unchanged."
            exit 1
          fi

      # Reads the pnpm version from the root package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      - name: Build web
        run: pnpm --filter web build

      - name: Verify the built site (noindex, the real key, the Function source)
        working-directory: web
        run: |
          pages="$(find dist -name '*.html' | wc -l)"
          echo "html pages: $pages"
          test "$pages" -gt 0
          grep -qx 'Disallow: /' dist/robots.txt
          grep -q 'noindex' dist/index.html
          if grep -rqF "$TURNSTILE_TEST_SITE_KEY" dist; then
            echo "::error::the built site contains Cloudflare's test site key"
            exit 1
          fi
          grep -rqF "$PUBLIC_TURNSTILE_SITE_KEY" dist
          test -f functions/api/lead.ts
          test -f functions/api/rebuild.ts
          # Open item 17: no address a visitor cannot open may reach the pages, from whichever source.
          if grep -rlE '(127\.0\.0\.1|localhost)(:[0-9]+)?/uploads' dist; then
            echo "::error::the built site points images at a local address"
            exit 1
          fi
          if [ "$CONTENT_SOURCE" = strapi ]; then
            grep -rqF "${STRAPI_URL%/}/uploads/" dist || echo "::warning::no page uses an image from the box (is any image uploaded?)"
          fi
          test -f wrangler.jsonc

      # Runs from web/ because wrangler finds functions/ and wrangler.jsonc beside it. npx, pinned, not
      # cloudflare/wrangler-action and not pnpm dlx: see docs/conventions/live-deploy.md for why.
      - name: Deploy to Cloudflare Pages
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npx --yes wrangler@4.152.0 pages deploy dist \
            --project-name=v-robotic --branch=main \
            --commit-hash="$GITHUB_SHA" --commit-message="web-deploy run $GITHUB_RUN_ID ($CONTENT_SOURCE)"
